[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "om-ced"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.2.0",
    "numpy>=2.5.5",
    "tokenizers>=0.23.3",
    "torch>=2.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]